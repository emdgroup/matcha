# ── Example config: Baseline evaluation with scikit-learn models ───────
#
# Cross-validate a RandomForestRegressor with RDKit descriptors as a
# baseline comparison for MATCHA models.
#
# Usage:
#   matcha baseline --config baseline.yaml

dataset:
  path: /path/to/data/train.csv
  smiles_key: SMILES
  label_key: endpoint
  operator_key: OPERATOR

split:
  method: cv
  n_subset: 10

model:
  algorithm: RandomForestRegressor
  n_jobs: 16
  feature_list: ["rdkit_all_descriptors"]
  label_transform: log10
  params:
    n_estimators: 100

output:
  mlflow:
    experiment_name: fraction-unbound-baseline-stats-large
    run_name: rdkit
    tags:
      version: 1.0
    log_dir: /path/to/mlflow
  serialization:
    path: /path/to/evaluation/my_run
