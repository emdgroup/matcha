# ── Example config: Prepare sparse multi-task dataset for pretraining ──
#
# Merge parquet/CSV files into a sparse CSR label matrix consumed by the
# ``pretrain_multitask`` command. Sparse mode uses zero-omission to encode
# missing entries and remaps classification labels ``0 → -1`` internally so
# "missing" and "inactive" are distinguishable. Choose this variant when the
# underlying label matrix is largely empty. For dense ``float32`` output (NaN
# marks missing, classification passes through as 0/1), see ``prepare_dense.yaml``.
#
# Usage:
#   matcha prepare_dataset --config prepare.yaml

datasets:
  files:
    - /path/to/data/dataset_a.parquet
    - /path/to/data/dataset_b.parquet
  task_type:
    - regression
    - regression
  # sparse: true  # set false for dense .npy output

metadata:
  merge_col: SMILES
  tag_to_add: PRETRAIN

validation:
  min_compounds: 10
  sampling_rate: 0.001
  seed: 42

output: /path/to/pretraining/data