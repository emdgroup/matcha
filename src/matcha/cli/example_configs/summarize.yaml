# matcha summarize — directory mode (default example)
# Each immediate subdirectory of root_dir is treated as one model run.
# The subdirectory name is used as the method label in plots.
root_dir: ./experiment

# Optional: path where summary_analysis.json and HTML plots are written
# output_path: ./outputs

# Optional: Statistical testing mode ("parametric", "non-parametric", or "bootstrap")
# "bootstrap" requires split.n_bootstrap > 1 in the evaluate config.
# statistical_test: non-parametric

# Optional: List of specific run names to compare (default: all runs)
# runs:
#   - chemprop
#   - gatedgcn

# --- MLflow mode (alternative) ---
# Uncomment and fill in the fields below; comment out root_dir above.
# experiment_name: fraction-unbound-baseline-stats-large
# mlruns_path: /path/to/mlflow
# output_path: ./outputs
